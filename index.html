<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>College Timetable</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
}


/* =================================
   THEME TOKENS
   ================================= */

:root {
    --bg: #f2f3f5;

    --text-primary: #16171a;
    --text-secondary: #3a3b3f;
    --text-muted: #535459;
    --text-muted-2: #5f6065;
    --text-faint: #69696e;
    --text-faint-2: #4a4b50;
    --text-faint-3: #6c6d72;
    --text-faint-4: #78797e;
    --text-faint-5: #78797e;
    --accent: #2563eb;
    --accent-rgb: 37, 99, 235;

    --card-bg-1: #ffffff;
    --card-bg-1-hover: #f5f6f8;
    --card-bg-1-hover2: #edeef1;
    --card-bg-2: #fbfbfc;

    --border-1: #e2e3e7;
    --border-1-hover: #d0d1d6;
    --border-1-active: #b7b8be;
    --border-2: #eceded;

    --hover-row: rgba(0,0,0,0.035);

    --shadow-1: 0 6px 20px rgba(20,20,30,0.08);
    --shadow-1-hover: 0 8px 25px rgba(20,20,30,0.12);
    --shadow-dropdown: 0 10px 25px rgba(20,20,30,0.12);
}

@media (prefers-color-scheme: dark) {

    :root:not([data-theme="light"]) {
        --bg: #101114;

        --text-primary: #ffffff;
        --text-secondary: #dddddd;
        --text-muted: #bdbdbd;
        --text-muted-2: #a2a2a2;
        --text-faint: #afafaf;
        --text-faint-2: #cacaca;
        --text-faint-3: #888888;
        --text-faint-4: #76767a;
        --text-faint-5: #808185;
        --accent: #7fb8ff;
        --accent-rgb: 127, 184, 255;

        --card-bg-1: #1c1d21;
        --card-bg-1-hover: #202126;
        --card-bg-1-hover2: #25262b;
        --card-bg-2: #18191d;

        --border-1: #2c2e34;
        --border-1-hover: #3d3f47;
        --border-1-active: #565a66;
        --border-2: #292b30;

        --hover-row: rgba(255,255,255,0.03);

        --shadow-1: 0 6px 25px rgba(0,0,0,0.25);
        --shadow-1-hover: 0 8px 30px rgba(0,0,0,0.35);
        --shadow-dropdown: 0 10px 30px rgba(0,0,0,0.4);
    }

}

:root[data-theme="dark"] {
    --bg: #101114;

    --text-primary: #ffffff;
    --text-secondary: #dddddd;
    --text-muted: #bdbdbd;
    --text-muted-2: #a2a2a2;
    --text-faint: #afafaf;
    --text-faint-2: #cacaca;
    --text-faint-3: #888888;
    --text-faint-4: #76767a;
    --text-faint-5: #808185;
    --accent: #7fb8ff;
    --accent-rgb: 127, 184, 255;

    --card-bg-1: #1c1d21;
    --card-bg-1-hover: #202126;
    --card-bg-1-hover2: #25262b;
    --card-bg-2: #18191d;

    --border-1: #2c2e34;
    --border-1-hover: #3d3f47;
    --border-1-active: #565a66;
    --border-2: #292b30;

    --hover-row: rgba(255,255,255,0.03);

    --shadow-1: 0 6px 25px rgba(0,0,0,0.25);
    --shadow-1-hover: 0 8px 30px rgba(0,0,0,0.35);
    --shadow-dropdown: 0 10px 30px rgba(0,0,0,0.4);
}


body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: center;

    transition: background-color 0.35s ease, color 0.35s ease;
}


/* APP SHELL — fits in one screen; only the lesson list scrolls internally */

main {
    max-width: 650px;
    margin: auto;

    height: 100vh;
    height: 100dvh;

    padding: 10px 12px 10px;

    display: flex;
    flex-direction: column;
    gap: 5px;

    position: relative;
    overflow: hidden;
}


/* DATE */

#date {
    color: var(--text-secondary);
    font-size: 17px;
    font-weight: 650;
    flex-shrink: 0;

    animation: fadeIn 0.4s ease;
    transition: color 0.35s ease;
}


/* STATUS */

.status {
    color: var(--text-muted);
    font-size: 15px;
    flex-shrink: 0;

    animation: fadeIn 0.4s ease;
    transition: color 0.35s ease;
}

.status strong {
    color: var(--text-primary);
    font-weight: 700;
    transition: color 0.35s ease;
}

#current, #next {
    flex-shrink: 0;
}


/* CURRENT LESSON */

.current-card {
    background: var(--card-bg-1);
    border: 1px solid var(--border-1);
    border-radius: 18px;

    padding: 12px 14px;

    text-align: center;

    box-shadow: var(--shadow-1);

    animation: fadeSlideIn 0.45s ease;
    transition: box-shadow 0.3s ease, transform 0.3s ease, background-color 0.35s ease, border-color 0.35s ease;
}

.current-card:hover {
    box-shadow: var(--shadow-1-hover);
    transform: translateY(-2px);
}

.current-label {
    color: var(--text-faint);
    font-size: 12px;

    text-transform: uppercase;
    letter-spacing: 1.5px;

    margin-bottom: 4px;
    transition: color 0.35s ease;
}

.current-subject {
    font-size: clamp(24px, 7vw, 36px);

    line-height: 1.08;
    font-weight: 800;

    margin-bottom: 5px;
}

.current-time {
    font-size: 16px;
    color: var(--text-faint-2);

    margin-bottom: 1px;
    transition: color 0.35s ease;
}

.current-remaining {
    font-size: 12px;
    color: var(--accent);
    font-weight: 650;

    text-transform: uppercase;
    letter-spacing: 0.5px;

    margin-bottom: 6px;
    transition: color 0.35s ease;
}

.room {
    font-size: 20px;
    font-weight: 750;

    margin-bottom: 1px;
}

.teacher {
    font-size: 14px;
    color: var(--text-muted);
    transition: color 0.35s ease;
}


/* NEXT */

.next-card {
    background: var(--card-bg-2);

    border: 1px solid var(--border-2);
    border-radius: 14px;

    padding: 7px 12px;

    text-align: center;

    animation: fadeSlideIn 0.45s ease;
    transition: box-shadow 0.3s ease, transform 0.3s ease, background-color 0.35s ease, border-color 0.35s ease;
}

.next-card:hover {
    transform: translateY(-2px);
}

.section-title {
    color: var(--text-muted-2);

    font-size: 12px;

    text-transform: uppercase;
    letter-spacing: 1.2px;

    margin-bottom: 3px;
    transition: color 0.35s ease;
}

.next-subject {
    font-size: 17px;
    font-weight: 700;
}

.next-time {
    color: var(--text-faint-2);

    font-size: 13px;

    margin-top: 2px;
    transition: color 0.35s ease;
}

.next-duration {
    color: var(--text-faint-3);
    font-size: 11px;
    margin-top: 0;
    transition: color 0.35s ease;
}

.next-room {
    color: var(--text-faint);

    font-size: 12px;

    margin-top: 3px;
    transition: color 0.35s ease;
}

.next-teacher {
    color: var(--text-muted-2);

    font-size: 12px;

    margin-top: 1px;
    transition: color 0.35s ease;
}


/* TODAY — fills remaining space; list scrolls internally if needed */

#today {
    flex: 1 1 auto;
    min-height: 0;

    display: flex;
}

.today-card {
    background: var(--card-bg-2);

    border: 1px solid var(--border-2);
    border-radius: 14px;

    padding: 7px 10px;

    text-align: center;

    display: flex;
    flex-direction: column;
    min-height: 0;
    flex: 1;

    animation: fadeSlideIn 0.5s ease;
    transition: background-color 0.35s ease, border-color 0.35s ease;
}

.lesson-list {
    flex: 1;
    min-height: 0;

    display: flex;
    flex-direction: column;
    justify-content: space-evenly;

    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}


/* LESSON */

.lesson {
    padding: 5px 8px;
    flex-shrink: 0;

    border-bottom: 1px solid var(--border-2);

    text-align: center;

    transition: background 0.25s ease, border-color 0.35s ease, box-shadow 0.3s ease;
    border-radius: 8px;
}

.lesson:hover {
    background: var(--hover-row);
}

.lesson:last-child {
    border-bottom: none;
}

.lesson-subject {
    font-size: 15px;
    font-weight: 650;
}

.lesson-time {
    color: var(--text-muted);

    font-size: 12px;

    margin-top: 1px;
    transition: color 0.35s ease;
}

.lesson-meta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;

    margin-top: 1px;
}

.lesson-duration {
    color: var(--text-faint-5);
    font-size: 11px;
    transition: color 0.35s ease;
}

.lesson-room {
    color: var(--text-faint);

    font-size: 12px;

    transition: color 0.35s ease;
}

.meta-dot {
    color: var(--text-faint-4);
    font-size: 8px;
    line-height: 1;
    transition: color 0.35s ease;
}

.lesson-teacher {
    color: var(--text-muted-2);

    font-size: 12px;

    margin-top: 1px;
    transition: color 0.35s ease;
}


/* CURRENT LESSON IN LIST */

.lesson.lesson-current {
    background: rgba(var(--accent-rgb), 0.1);
    border-bottom-color: transparent;

    box-shadow:
        inset 3px 0 0 var(--accent),
        0 0 14px rgba(var(--accent-rgb), 0.25);
}

.lesson.lesson-current .lesson-subject {
    color: var(--accent);
}

.lesson.lesson-current:hover {
    background: rgba(var(--accent-rgb), 0.14);
}


/* FREE PERIOD */

.free-period {
    padding: 5px 8px;
    margin: 3px 0;
    flex-shrink: 0;

    background: rgba(var(--accent-rgb), 0.05);
    border: 1px dashed rgba(var(--accent-rgb), 0.3);

    text-align: center;

    transition: background 0.25s ease, border-color 0.35s ease;
    border-radius: 10px;
}

.free-period:hover {
    background: rgba(var(--accent-rgb), 0.09);
}

.free-period:last-child {
    border-bottom: 1px dashed rgba(var(--accent-rgb), 0.3);
}

.free-title {
    font-size: 13px;

    font-weight: 600;
    letter-spacing: 0.4px;

    color: var(--text-faint-3);
    transition: color 0.35s ease;
}

.free-title::before {
    content: "☕";
    margin-right: 4px;
    font-size: 11px;
}

.free-meta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;

    margin-top: 1px;
}

.free-time {
    color: var(--text-faint-4);

    font-size: 12px;

    transition: color 0.35s ease;
}

.free-duration {
    color: var(--text-faint-4);
    font-size: 11px;
    opacity: 0.8;
    transition: color 0.35s ease;
}


/* WEEKEND */

.weekend-card {
    background: var(--card-bg-2);

    border: 1px solid var(--border-2);
    border-radius: 14px;

    padding: 20px 15px;

    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    animation: fadeSlideIn 0.45s ease;
    transition: background-color 0.35s ease, border-color 0.35s ease;
}

.weekend-title {
    font-size: 24px;
    font-weight: 750;

    margin-bottom: 5px;
}

.weekend-subtitle {
    color: var(--text-muted-2);
    font-size: 14px;
    transition: color 0.35s ease;
}


/* =================================
   BOTTOM CONTROLS
   ================================= */

.bottom-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;

    flex-shrink: 0;
}

.left-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}


/* REFRESH BUTTON */

.refresh-btn {
    width: 40px;
    height: 40px;
    flex-shrink: 0;

    border-radius: 50%;

    background: var(--card-bg-1);
    border: 1px solid var(--border-1);
    box-shadow: var(--shadow-1);

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, transform 0.15s ease;
}

.refresh-btn:hover {
    border-color: var(--border-1-hover);
    background: var(--card-bg-1-hover);
    box-shadow: var(--shadow-1-hover);
    transform: translateY(-1px);
}

.refresh-btn:active {
    transform: scale(0.9);
}

.refresh-btn svg {
    width: 17px;
    height: 17px;
    stroke: var(--text-faint-2);
    transition: stroke 0.35s ease;
}

.refresh-btn.spinning svg {
    animation: spin 0.6s ease;
}


/* CUSTOM DROPDOWN (shared: day picker + theme picker) */

.custom-dropdown {
    position: relative;

    width: 46%;
    max-width: 170px;
    min-width: 118px;
}

.custom-dropdown.theme-dropdown {
    width: auto;
    min-width: 96px;
    max-width: 120px;
}

.dropdown-trigger {
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;

    padding: 9px 12px;

    background: var(--card-bg-1);
    color: var(--text-primary);

    border: 1px solid var(--border-1);
    border-radius: 13px;
    box-shadow: var(--shadow-1);

    font-size: 15px;
    font-weight: 600;
    font-family: inherit;

    cursor: pointer;

    transition: background-color 0.25s ease, border-color 0.25s ease, color 0.35s ease, box-shadow 0.25s ease, transform 0.15s ease;
}

.theme-dropdown .dropdown-trigger {
    font-size: 14px;
    padding: 9px 11px;
}

.dropdown-trigger:hover {
    border-color: var(--border-1-hover);
    box-shadow: var(--shadow-1-hover);
    transform: translateY(-1px);
}

.dropdown-trigger:active {
    transform: translateY(0) scale(0.98);
}

.custom-dropdown.open .dropdown-trigger {
    border-color: var(--accent);
    background: var(--card-bg-1-hover);
    box-shadow: var(--shadow-1-hover);
}

.dropdown-trigger-label {
    display: flex;
    align-items: center;
    gap: 5px;
    overflow: hidden;
    white-space: nowrap;
}

.theme-icon {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
    stroke: var(--text-faint-2);
    fill: none;
    stroke-width: 2;
    transition: stroke 0.35s ease;
}

.dropdown-arrow {
    width: 10px;
    height: 10px;

    stroke: var(--text-faint);
    fill: none;
    stroke-width: 2;

    transition: transform 0.3s ease, stroke 0.35s ease;

    flex-shrink: 0;
    margin-left: 4px;
}

.custom-dropdown.open .dropdown-arrow {
    transform: rotate(180deg);
}

.dropdown-list {
    position: absolute;

    bottom: calc(100% + 6px);
    left: 0;
    right: 0;

    background: var(--card-bg-1);
    border: 1px solid var(--border-1);
    border-radius: 13px;

    overflow: hidden;

    max-height: 0;
    opacity: 0;
    transform: translateY(8px);

    transition: max-height 0.35s ease, opacity 0.25s ease, transform 0.25s ease, background-color 0.35s ease, border-color 0.35s ease;

    box-shadow: var(--shadow-dropdown);

    z-index: 20;
}

.custom-dropdown.open .dropdown-list {
    max-height: 300px;
    opacity: 1;
    transform: translateY(0);
}

.dropdown-option {
    padding: 9px 10px;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;

    text-align: center;
    font-size: 15px;
    font-weight: 500;
    color: var(--text-faint-2);

    cursor: pointer;

    transition: background-color 0.2s ease, color 0.2s ease;
}

.theme-dropdown .dropdown-option {
    font-size: 14px;
}

.dropdown-option:hover {
    background: var(--card-bg-1-hover2);
    color: var(--text-primary);
}

.dropdown-option.selected {
    background: rgba(var(--accent-rgb), 0.12);
    color: var(--accent);
    font-weight: 700;
}


/* =================================
   REFRESH OVERLAY
   ================================= */

.refresh-overlay {
    position: fixed;
    inset: 0;

    background: #000;
    opacity: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;

    z-index: 1000;
}

.refresh-overlay.active {
    pointer-events: auto;
    animation: backdropFade 3s ease forwards;
}

.spinner-wrap {
    opacity: 0;
}

.refresh-overlay.active .spinner-wrap {
    animation: spinnerFly 3s ease forwards;
}

.spinner {
    width: 44px;
    height: 44px;

    border: 4px solid rgba(255,255,255,0.15);
    border-top-color: #fff;
    border-radius: 50%;

    animation: spin 0.8s linear infinite;
}


/* ANIMATIONS */

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes fadeSlideIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes backdropFade {
    0%    { opacity: 0; }
    16.7% { opacity: 0.5; }
    83.3% { opacity: 0.5; }
    100%  { opacity: 0; }
}

@keyframes spinnerFly {
    0%    { opacity: 0; transform: translateY(-70px) scale(0.4); }
    16.7% { opacity: 1; transform: translateY(0) scale(1); }
    83.3% { opacity: 1; transform: translateY(0) scale(1); }
    100%  { opacity: 0; transform: translateY(70px) scale(0.4); }
}

</style>
</head>


<body>

<main>

    <div id="date"></div>

    <div id="status"></div>

    <div id="current"></div>

    <div id="next"></div>

    <div id="today"></div>


    <!-- BOTTOM CONTROLS: refresh + theme (left) / day dropdown (right) -->

    <div class="bottom-controls">

        <div class="left-controls">

            <button class="refresh-btn" id="refreshBtn" type="button" aria-label="Refresh">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                    <polyline points="21 3 21 9 15 9" />
                </svg>
            </button>

            <div class="custom-dropdown theme-dropdown" id="themeDropdown">

                <button class="dropdown-trigger" id="themeDropdownTrigger" type="button" aria-label="Theme">
                    <span class="dropdown-trigger-label">
                        <svg class="theme-icon" id="themeIcon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"></svg>
                        <span id="themeLabel">Device</span>
                    </span>
                    <svg class="dropdown-arrow" viewBox="0 0 12 8">
                        <polyline points="1 1 6 6 11 1" />
                    </svg>
                </button>

                <div class="dropdown-list" id="themeDropdownList"></div>

            </div>

        </div>

        <div class="custom-dropdown" id="customDropdown">

            <button class="dropdown-trigger" id="dropdownTrigger" type="button" aria-label="Select day">
                <span id="dropdownLabel">Monday</span>
                <svg class="dropdown-arrow" viewBox="0 0 12 8">
                    <polyline points="1 1 6 6 11 1" />
                </svg>
            </button>

            <div class="dropdown-list" id="dropdownList"></div>

        </div>

    </div>

</main>


<!-- REFRESH OVERLAY -->

<div class="refresh-overlay" id="refreshOverlay">
    <div class="spinner-wrap">
        <div class="spinner"></div>
    </div>
</div>


<script>

/* =================================
   TEST MODE

const TEST_MODE = false;

/* =================================

const timetable = {

        ["11:45", "12:55", "Maths", "J209", "T Howard"]
    ],

    6: [],
    0: []

};


/* =================================
   DAYS
   ================================= */

const dayNames = [
    "Sunday",
    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday",
    "Saturday"
];

/* Order used for the dropdown: weekdays first, then weekend */
const orderedDays = [1, 2, 3, 4, 5, 6, 0];


/* =================================
   TIME FUNCTION
   ================================= */

function minutes(time) {

    const parts = time.split(":");

    return Number(parts[0]) * 60 +
           Number(parts[1]);
}


/* =================================
   DURATION / TIME-LEFT FORMATTING
   ================================= */

function formatDurationShort(totalMinutes) {

    const h = Math.floor(totalMinutes / 60);
    const m = totalMinutes % 60;

    if (h > 0 && m > 0) {
        return `${h}h ${m}m`;
    }

    if (h > 0) {
        return `${h}h`;
    }

    return `${m}m`;
}

function lessonDuration(lesson) {
    return formatDurationShort(minutes(lesson[1]) - minutes(lesson[0]));
}

function slotDuration(start, end) {
    return formatDurationShort(minutes(end) - minutes(start));
}

function timeLeft(endTime, currentMinutes) {

    const diff = minutes(endTime) - currentMinutes;

    if (diff <= 0) {
        return null;
    }

    return formatDurationShort(diff) + " left";
}


/* =================================
   FULL DATE FOR A GIVEN WEEKDAY
   ================================= */

function getDateForDay(day) {

    const now = new Date();

    const mondayOffset = (now.getDay() + 6) % 7;

    const monday = new Date(now);
    monday.setDate(now.getDate() - mondayOffset);
    monday.setHours(0, 0, 0, 0);

    const offsetFromMonday = { 1: 0, 2: 1, 3: 2, 4: 3, 5: 4, 6: 5, 0: 6 };

    const target = new Date(monday);
    target.setDate(monday.getDate() + offsetFromMonday[day]);

    return target;
}

function formatFullDate(date) {

    return date.toLocaleDateString("en-GB", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
    });
}


/* =================================
   THEME (light / dark / device)
   ================================= */

const THEME_KEY = "timetable-theme-preference";

const THEME_ICONS = {

    light: `<circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>`,

    dark: `<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path>`,

    device: `<rect x="3" y="4" width="18" height="12" rx="2"></rect>
             <path d="M8 20h8M12 16v4"></path>`

};

const themeOptions = [
    { value: "light", label: "Light" },
    { value: "dark", label: "Dark" },
    { value: "device", label: "Device" }
];

let themePref = localStorage.getItem(THEME_KEY) || "device";

function applyTheme(pref) {

    if (pref === "device") {
        document.documentElement.removeAttribute("data-theme");
    } else {
        document.documentElement.setAttribute("data-theme", pref);
    }

}

const themeDropdown = document.getElementById("themeDropdown");
const themeDropdownTrigger = document.getElementById("themeDropdownTrigger");
const themeLabel = document.getElementById("themeLabel");
const themeIcon = document.getElementById("themeIcon");
const themeDropdownList = document.getElementById("themeDropdownList");


for (const opt of themeOptions) {

    const el = document.createElement("div");

    el.className = "dropdown-option";
    el.dataset.value = opt.value;
    el.textContent = opt.label;

    el.addEventListener("click", () => {
        themePref = opt.value;
        localStorage.setItem(THEME_KEY, themePref);
        applyTheme(themePref);
        updateThemeUI();
        closeThemeDropdown();
    });

    themeDropdownList.appendChild(el);
}


function updateThemeUI() {

    const current = themeOptions.find(o => o.value === themePref) || themeOptions[2];

    themeLabel.textContent = current.label;
    themeIcon.innerHTML = THEME_ICONS[current.value];

    themeDropdownList.querySelectorAll(".dropdown-option").forEach(opt => {
        opt.classList.toggle("selected", opt.dataset.value === themePref);
    });

}

function closeThemeDropdown() {
    themeDropdown.classList.remove("open");
}

themeDropdownTrigger.addEventListener("click", (event) => {
    event.stopPropagation();
    themeDropdown.classList.toggle("open");
});

document.addEventListener("click", (event) => {

    if (!themeDropdown.contains(event.target)) {
        closeThemeDropdown();
    }

});


applyTheme(themePref);
updateThemeUI();


/* =================================
   CUSTOM DROPDOWN (day picker)
   ================================= */

const customDropdown = document.getElementById("customDropdown");
const dropdownTrigger = document.getElementById("dropdownTrigger");
const dropdownLabel = document.getElementById("dropdownLabel");
const dropdownList = document.getElementById("dropdownList");

let selectedDay = new Date().getDay();


for (const day of orderedDays) {

    const option = document.createElement("div");

    option.className = "dropdown-option";
    option.dataset.day = day;
    option.textContent = dayNames[day];

    option.addEventListener("click", () => {
        selectedDay = day;
        updateDropdownUI();
        closeDropdown();
        displayDay(selectedDay);
    });

    dropdownList.appendChild(option);
}


function updateDropdownUI() {

    dropdownLabel.textContent = dayNames[selectedDay];

    dropdownList.querySelectorAll(".dropdown-option").forEach(opt => {

        opt.classList.toggle(
            "selected",
            Number(opt.dataset.day) === selectedDay
        );

    });

}


function closeDropdown() {
    customDropdown.classList.remove("open");
}


dropdownTrigger.addEventListener("click", (event) => {
    event.stopPropagation();
    customDropdown.classList.toggle("open");
});

document.addEventListener("click", (event) => {

    if (!customDropdown.contains(event.target)) {
        closeDropdown();
    }

});


/* =================================
   REFRESH OVERLAY (fly-in spinner)
   ================================= */

const refreshOverlay = document.getElementById("refreshOverlay");
const refreshBtn = document.getElementById("refreshBtn");


function triggerRefreshOverlay(callback) {

    refreshOverlay.classList.remove("active");
    void refreshOverlay.offsetWidth;
    refreshOverlay.classList.add("active");

    setTimeout(() => {
        callback();
    }, 500);

    setTimeout(() => {
        refreshOverlay.classList.remove("active");
    }, 3000);

}


refreshBtn.addEventListener("click", () => {

    refreshBtn.classList.remove("spinning");
    void refreshBtn.offsetWidth;
    refreshBtn.classList.add("spinning");

    triggerRefreshOverlay(() => displayDay(selectedDay));

    resetAutoRefresh();

});


/* =================================
   DISPLAY SELECTED DAY
   ================================= */

function displayDay(day) {

    const lessons = timetable[day] || [];

    const now = new Date();

    const realDay = now.getDay();

    const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();


    /* FULL DATE */

    document.getElementById("date").textContent =
        formatFullDate(getDateForDay(day));

    updateDropdownUI();


    /* =================================
       WEEKEND
       ================================= */

    if (day === 0 || day === 6) {

        document.getElementById("status").innerHTML = `

            <div class="status">
                <strong>No lessons</strong> · Out of school hours
            </div>

        `;

        document.getElementById("current").innerHTML = "";

        document.getElementById("next").innerHTML = "";

        document.getElementById("today").innerHTML = `

            <div class="weekend-card">

                <div class="weekend-title">
                    No lessons
                </div>

                <div class="weekend-subtitle">
                    Out of school hours
                </div>

            </div>

        `;

        return;
    }


    /* =================================
       SCHOOL DAY STATUS
       ================================= */

    document.getElementById("status").innerHTML = `

        <div class="status">
            School day
        </div>

    `;


    /* =================================
       CURRENT LESSON
       ================================= */

    if (TEST_MODE && day === realDay) {

        document.getElementById("current").innerHTML = `

            <div class="current-card">

                <div class="current-label">
                    Currently
                </div>

                <div class="current-subject">
                    ${testLesson[2]}
                </div>

                <div class="current-time">
                    ${testLesson[0]} – ${testLesson[1]}
                </div>

                ${(() => {
                    const left = timeLeft(testLesson[1], currentMinutes);
                    return left ? `<div class="current-remaining">${left}</div>` : "";
                })()}

                <div class="room">
                    ${testLesson[3]}
                </div>

                <div class="teacher">
                    ${testLesson[4]}
                </div>

            </div>

        `;

    } else {

        let current = null;
        let next = null;


        if (day === realDay) {

            for (const lesson of lessons) {

                const start = minutes(lesson[0]);
                const end = minutes(lesson[1]);


                if (currentMinutes >= start && currentMinutes < end) {
                    current = lesson;
                }


                if (currentMinutes < start && next === null) {
                    next = lesson;
                }

            }

        }


        if (current) {

            document.getElementById("current").innerHTML = `

                <div class="current-card">

                    <div class="current-label">
                        Currently
                    </div>

                    <div class="current-subject">
                        ${current[2]}
                    </div>

                    <div class="current-time">
                        ${current[0]} – ${current[1]}
                    </div>

                    ${(() => {
                        const left = timeLeft(current[1], currentMinutes);
                        return left ? `<div class="current-remaining">${left}</div>` : "";
                    })()}

                    <div class="room">
                        ${current[3]}
                    </div>

                    <div class="teacher">
                        ${current[4]}
                    </div>

                </div>

            `;

        } else {

            document.getElementById("current").innerHTML = `

                <div class="current-card">

                    <div class="current-label">
                        Currently
                    </div>

                    <div class="current-subject">
                        No class
                    </div>

                </div>

            `;

        }


        if (next) {

            document.getElementById("next").innerHTML = `

                <div class="next-card">

                    <div class="section-title">
                        Next
                    </div>

                    <div class="next-subject">
                        ${next[2]}
                    </div>

                    <div class="next-time">
                        ${next[0]} – ${next[1]}
                    </div>

                    <div class="next-duration">
                        ${lessonDuration(next)}
                    </div>

                    <div class="next-room">
                        ${next[3]}
                    </div>

                    <div class="next-teacher">
                        ${next[4]}
                    </div>

                </div>

            `;

        } else {

            document.getElementById("next").innerHTML = "";

        }

    }


    /* =================================
       FULL TIMETABLE
       ================================= */

    let rowsHTML = "";

    const sortedLessons = [...lessons].sort(
        (a, b) => minutes(a[0]) - minutes(b[0])
    );

    const isLessonNow = day === realDay;

    const lessonRow = (lesson) => {

        const isCurrent =
            isLessonNow &&
            currentMinutes >= minutes(lesson[0]) &&
            currentMinutes < minutes(lesson[1]);

        return `

        <div class="lesson${isCurrent ? " lesson-current" : ""}">

            <div class="lesson-subject">
                ${lesson[2]}
            </div>

            <div class="lesson-time">
                ${lesson[0]} – ${lesson[1]}
            </div>

            <div class="lesson-meta">
                <span class="lesson-duration">${lessonDuration(lesson)}</span>
                <span class="meta-dot">•</span>
                <span class="lesson-room">${lesson[3]}</span>
            </div>

            <div class="lesson-teacher">
                ${lesson[4]}
            </div>

        </div>

    `;
    };

    const freeRow = (start, end) => `

        <div class="free-period">

            <div class="free-title">FREE PERIOD</div>

            <div class="free-meta">
                <span class="free-time">${start} – ${end}</span>
                <span class="meta-dot">•</span>
                <span class="free-duration">${slotDuration(start, end)}</span>
            </div>

        </div>

    `;

    for (let i = 0; i < sortedLessons.length; i++) {

        const lesson = sortedLessons[i];

        rowsHTML += lessonRow(lesson);

        const nextLesson = sortedLessons[i + 1];

        if (nextLesson && minutes(nextLesson[0]) > minutes(lesson[1])) {
            rowsHTML += freeRow(lesson[1], nextLesson[0]);
        }

    }


    document.getElementById("today").innerHTML = `

        <div class="today-card">

            <div class="section-title">
                ${dayNames[day]}'s Timetable
            </div>

            <div class="lesson-list">
                ${rowsHTML}
            </div>

        </div>

    `;

}


/* =================================
   INITIAL LOAD
   ================================= */

updateDropdownUI();
displayDay(selectedDay);


/* =================================
   AUTOMATIC UPDATE (every 5 mins)
   ================================= */

let autoRefreshId;

function startAutoRefresh() {

    autoRefreshId = setInterval(() => {
        triggerRefreshOverlay(() => displayDay(selectedDay));
    }, 300000);

}

function resetAutoRefresh() {
    clearInterval(autoRefreshId);
    startAutoRefresh();
}

startAutoRefresh();

</script>
